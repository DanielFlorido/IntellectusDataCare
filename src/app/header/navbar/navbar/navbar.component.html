<nav>
    <ul>
      <li *ngFor="let item of items" class="nav-item">
        <a
          [routerLink]="[item.nombre]"
          routerLinkActive="activo"
          [routerLinkActiveOptions]="{ exact: false }"
          class="nav-link"
        >
          {{ item.nombre }}
        </a>
      </li>
    </ul>
  </nav>
